:root{font-family:"Manrope Variable","Segoe UI",Arial,sans-serif;font-synthesis:none;color:var(--ink);background:#f8f6fa;--ink:#35264f;--purple:#65469a;--accent:#65469a;--accent-hover:#533782;--accent-soft:#eee8f6;--paper:#fffdfd;--muted:#7b6b8d;--line:#e5ddec;--ease:cubic-bezier(.2,.8,.2,1);--shadow:0 10px 32px #39284b07}
*{box-sizing:border-box}body{margin:0;font-size:16px;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer;border:0;line-height:1.25}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #9c7ec9;outline-offset:4px}input:focus,textarea:focus{outline:0;border-color:#9277b8;box-shadow:0 0 0 3px #9277b815}a{color:var(--purple);text-underline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.25}input,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:transparent;color:var(--ink);transition:border-color .2s,box-shadow .2s}input::placeholder,textarea::placeholder{color:var(--muted)}textarea{resize:vertical;min-height:80px}label,.field-label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}.field{margin-bottom:14px}.optional,.muted{color:var(--muted);font-weight:400}.small{font-size:14px;line-height:1.6}
